<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IT-2321 Lab 5</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>Lab 5: Interactive Page</h1>
  <p>Wire up the controls below in script.js. Respond to events, change the
     page through the DOM, and use a timer for something that updates on its own.</p>

  <section>
    <button id="actionBtn">Click me</button>
    <p id="clickCount">Clicks: 0</p>
  </section>

  <section>
    <p>Seconds on this page: <span id="timer">0</span></p>
  </section>

  <div id="output">Notes and other output can appear here.</div>

  <script src="script.js"></script>
</body>
</html>
